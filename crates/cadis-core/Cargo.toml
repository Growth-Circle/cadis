[package]
name = "cadis-core"
version = "1.2.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
cadis-memory.workspace = true
cadis-models.workspace = true
cadis-output-filter.workspace = true
cadis-policy.workspace = true
cadis-protocol.workspace = true
cadis-store.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

# Signal delivery for terminating worker process groups. Unix only: `nix` does
# not build on Windows, and the Windows CI job compiles the whole workspace.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
